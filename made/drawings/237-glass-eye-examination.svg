<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  
  <!-- Grid paper texture -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#333" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>

  <!-- The glass eye at center -->
  <g id="eye" transform="translate(400,300)">
    <!-- Outer glass dome -->
    <ellipse cx="0" cy="0" rx="85" ry="70" fill="none" stroke="#4a90d9" stroke-width="3" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="82" ry="67" fill="#0a1a2a" opacity="0.9"/>
    
    <!-- Iris -->
    <ellipse cx="0" cy="0" rx="45" ry="45" fill="#1a4a7a"/>
    <ellipse cx="0" cy="0" rx="42" ry="42" fill="#2a5a8a"/>
    <ellipse cx="-5" cy="-5" rx="38" ry="38" fill="#3a6a9a" opacity="0.8"/>
    
    <!-- Pupil -->
    <ellipse cx="0" cy="0" rx="18" ry="18" fill="#050505"/>
    
    <!-- Catch light -->
    <ellipse cx="-12" cy="-12" rx="6" ry="5" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="8" cy="8" rx="2" ry="2" fill="#ffffff" opacity="0.4"/>
    
    <!-- Threaded brass socket at back (shown in cutaway) -->
    <g transform="translate(0, 55)">
      <!-- Socket body -->
      <rect x="-12" y="0" width="24" height="25" fill="#b8860b" stroke="#8b6508" stroke-width="1.5"/>
      <!-- Threads -->
      <g stroke="#8b6508" stroke-width="1">
        <line x1="-12" y1="3" x2="12" y2="3"/>
        <line x1="-12" y1="7" x2="12" y2="7"/>
        <line x1="-12" y1="11" x2="12" y2="11"/>
        <line x1="-12" y1="15" y2="15" x2="12"/>
        <line x1="-12" y1="19" x2="12" y2="19"/>
        <line x1="-12" y1="23" x2="12" y2="23"/>
      </g>
      <!-- 3mm marking -->
      <text x="0" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#ddd">3mm fine pitch</text>
    </g>
  </g>

  <!-- Measurement callouts -->
  <!-- Diameter -->
  <line x1="315" y1="230" x2="485" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="315" y1="225" x2="315" y2="235" stroke="#888" stroke-width="1"/>
  <line x1="485" y1="225" x2="485" y2="235" stroke="#888" stroke-width="1"/>
  <text x="400" y="218" text-anchor="middle" font-family="monospace" font-size="11" fill="#aaa">17mm dome</text>

  <!-- Height -->
  <line x1="315" y1="230" x2="315" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="310" y1="230" x2="320" y2="230" stroke="#888" stroke-width="1"/>
  <line x1="310" y1="370" x2="320" y2="370" stroke="#888" stroke-width="1"/>
  <text x="300" y="305" text-anchor="end" font-family="monospace" font-size="11" fill="#aaa" transform="rotate(-90, 300, 305)">14mm</text>

  <!-- Socket depth -->
  <line x1="485" y1="355" x2="485" y2="410" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="355" x2="490" y2="355" stroke="#888" stroke-width="1"/>
  <line x1="480" y1="410" x2="490" y2="410" stroke="#888" stroke-width="1"/>
  <text x="495" y="385" text-anchor="start" font-family="monospace" font-size="11" fill="#aaa">socket 6mm deep</text>

  <!-- Notes around the edge -->
  <g font-family="monospace" font-size="10" fill="#888">
    <text x="50" y="50">glass eye from jar of mixed screws</text>
    <text x="50" y="65">blue iris, threaded brass socket 3mm fine pitch</text>
    <text x="50" y="80">no markings inside dome, no serial, no maker</text>
    <text x="50" y="95">weight: ~4g (held against 5g test weight)</text>
    <text x="50" y="110">refracts text beneath — inverted, sharp</text>
    <text x="50" y="125">socket threads clean, no burr, cut not cast</text>
    <text x="50" y="140">— nim, 2026-11-12</text>
  </g>

  <!-- Ruler along bottom -->
  <g stroke="#444" stroke-width="1">
    <line x1="100" y1="550" x2="700" y2="550"/>
    <g id="mm-ticks">
      <!-- generated by script -->
    </g>
  </g>
  <g font-family="monospace" font-size="9" fill="#666">
    <text x="100" y="570" text-anchor="middle">0</text>
    <text x="200" y="570" text-anchor="middle">10</text>
    <text x="300" y="570" text-anchor="middle">20</text>
    <text x="400" y="570" text-anchor="middle">30</text>
    <text x="500" y="570" text-anchor="middle">40</text>
    <text x="600" y="570" text-anchor="middle">50</text>
    <text x="700" y="570" text-anchor="middle">60mm</text>
  </g>

  <!-- Ticks for ruler -->
  <script><![CDATA[
    const g = document.getElementById('mm-ticks');
    for (let i = 0; i <= 60; i++) {
      const x = 100 + i * 10;
      const h = i % 10 === 0 ? 15 : (i % 5 === 0 ? 10 : 5);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x);
      line.setAttribute('y1', 550);
      line.setAttribute('x2', x);
      line.setAttribute('y2', 550 - h);
      line.setAttribute('stroke', '#444');
      line.setAttribute('stroke-width', '0.5');
      g.appendChild(line);
    }
  ]]></script>
</svg>
