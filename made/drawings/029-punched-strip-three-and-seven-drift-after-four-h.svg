<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- strip body, slightly warped -->
  <path d="M10 95 Q15 93 20 94 T50 95 T85 96 T120 94.5 T155 95.5 T190 94" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>
  <path d="M10 105 Q15 107 20 106 T50 105 T85 104 T120 105.5 T155 104.5 T190 106" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>
  <path d="M10 95 L10 105 M190 94 L190 106" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>
  <!-- fiber texture -->
  <g stroke="#3a3a3a" stroke-width="0.4" opacity="0.4">
    <line x1="18" y1="97" x2="28" y2="98"/>
    <line x1="35" y1="101" x2="44" y2="100"/>
    <line x1="52" y1="98" x2="61" y2="99"/>
    <line x1="70" y1="102" x2="79" y2="101"/>
    <line x1="88" y1="99" x2="97" y2="100"/>
    <line x1="106" y1="100" x2="115" y2="99"/>
    <line x1="124" y1="101" x2="133" y2="102"/>
    <line x1="142" y1="99" x2="151" y2="98"/>
    <line x1="160" y1="102" x2="169" y2="101"/>
    <line x1="175" y1="100" x2="184" y2="101"/>
  </g>
  <!-- position ticks (13 hours), drift after 4 -->
  <g stroke="#444" stroke-width="0.6">
    <line x1="22" y1="95" x2="22" y2="105"/>   <!-- 1 -->
    <line x1="36" y1="95" x2="36" y2="105"/>   <!-- 2 -->
    <line x1="50" y1="95" x2="50" y2="105"/>   <!-- 3 -->
    <line x1="64" y1="95" x2="64" y2="105"/>   <!-- 4 -->
    <line x1="79" y1="95" x2="79" y2="105"/>   <!-- 5 drift starts -->
    <line x1="95" y1="95" x2="95" y2="105"/>   <!-- 6 -->
    <line x1="112" y1="95" x2="112" y2="105"/> <!-- 7 -->
    <line x1="130" y1="95" x2="130" y2="105"/> <!-- 8 -->
    <line x1="149" y1="95" x2="149" y2="105"/> <!-- 9 -->
    <line x1="169" y1="95" x2="169" y2="105"/> <!-- 10 -->
    <line x1="185" y1="95" x2="185" y2="105"/> <!-- 11 -->
  </g>
  <!-- hole at 3 (cleaner punch) -->
  <path d="M46 97 Q48 95.5 50 96 Q52 97.5 50 99 Q48 100.5 46 99 Q44 97.5 46 97" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- hole at 7 (hollow landing — ragged, oversize, strip thins around it) -->
  <!-- hollow void around hole 7 -->
  <path d="M102 92 Q106 90 110 91 T118 94 T116 100 T110 102 T102 101 T98 97 T100 93 Z" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="0.4" opacity="0.6"/>
  <!-- the punched hole itself, torn -->
  <path d="M105 97 Q108 95.5 112 96 Q114.5 98 112 100 Q109 101.5 106 100.5 Q103.5 99 104 97.5 Q104.5 96 105 97" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- stress tears radiating from hollow -->
  <g stroke="#222" stroke-width="0.35" opacity="0.5">
    <line x1="100" y1="96" x2="96" y2="94"/>
    <line x1="101" y1="99" x2="96" y2="101"/>
    <line x1="117" y1="95" x2="122" y2="92"/>
    <line x1="116" y1="99" x2="121" y2="103"/>
  </g>
</svg>