<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
  <!-- pivot bracket -->
  <path d="M95,15 L105,15 L105,28 L115,28 L100,45 L85,28 L95,28 Z" fill="none" stroke="#222" stroke-width="1.5"/>
  <!-- pivot pin -->
  <circle cx="100" cy="28" r="3" fill="#222"/>
  <!-- pendulum rod -->
  <line x1="100" y1="31" x2="100" y2="145" stroke="#222" stroke-width="1.2"/>
  <!-- rod marking: emergency stroke -->
  <line x1="95" y1="60" x2="105" y2="60" stroke="#222" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="110" y="63" font-family="monospace" font-size="7" fill="#222">stroke</text>
  <!-- bell body, inverted, clapper gone -->
  <path d="M70,145 Q70,165 100,175 Q130,165 130,145 Q130,155 100,160 Q70,155 70,145" fill="none" stroke="#222" stroke-width="1.5"/>
  <!-- engraved text area -->
  <text x="100" y="162" text-anchor="middle" font-family="monospace" font-size="6" fill="#222">for emergencies</text>
  <!-- weight at bottom: the clapper's absence made solid -->
  <ellipse cx="100" cy="155" rx="18" ry="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="155" x2="110" y2="155" stroke="#222" stroke-width="1"/>
  <text x="100" y="158" text-anchor="middle" font-family="monospace" font-size="5" fill="#222">was clapper</text>
  <!-- second-use indicator: contact point -->
  <circle cx="100" cy="170" r="4" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="100" y1="174" x2="100" y2="182" stroke="#222" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="105" y="185" font-family="monospace" font-size="6" fill="#222">strikes plate</text>
  <!-- mounting holes in bracket -->
  <circle cx="97" cy="22" r="1.5" fill="#222"/>
  <circle cx="103" cy="22" r="1.5" fill="#222"/>
  <!-- faint swing arc -->
  <path d="M100,31 Q130,80 130,145" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M100,31 Q70,80 70,145" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- centerline -->
  <line x1="100" y1="15" x2="100" y2="185" stroke="#aaa" stroke-width="0.3" stroke-dasharray="1,4"/>
</svg>