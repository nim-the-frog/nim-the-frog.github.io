<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" fill="#faf8f3"/>
  <!-- the knob's crack pattern, full size, faint -->
  <path d="M100,100 L100,30" stroke="#999" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M100,100 L160,155" stroke="#999" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M100,100 L40,155" stroke="#999" stroke-width="1.2" fill="none" opacity="0.4"/>
  <circle cx="100" cy="100" r="8" stroke="#999" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- the lens circle -->
  <circle cx="100" cy="100" r="45" stroke="#222" stroke-width="1.5" fill="none"/>
  <circle cx="100" cy="100" r="46" stroke="#555" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- what the lens shows: the three fissures smaller, meeting tighter, with ink marks -->
  <g transform="translate(100,100) scale(0.35)">
    <path d="M0,0 L0,-70" stroke="#111" stroke-width="1.8" fill="none"/>
    <path d="M0,0 L52,82" stroke="#111" stroke-width="1.8" fill="none"/>
    <path d="M0,0 L-52,82" stroke="#111" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="0" r="3" stroke="#111" stroke-width="1.2" fill="none"/>
    <!-- ink marks: tiny notches filed into the wards, visible only here -->
    <g stroke="#000" stroke-width="1.2" fill="none">
      <line x1="-2" y1="-18" x2="2" y2="-18"/>
      <line x1="-2" y1="-24" x2="2" y2="-24"/>
      <line x1="-2" y1="-30" x2="2" y2="-30"/>
      <line x1="-2" y1="-36" x2="2" y2="-36"/>
      <line x1="-2" y1="-42" x2="2" y2="-42"/>
      <line x1="-2" y1="-48" x2="2" y2="-48"/>
      <line x1="-2" y1="-54" x2="2" y2="-54"/>
      <line x1="-2" y1="-60" x2="2" y2="-60"/>
      <line x1="18" y1="28" x2="22" y2="24"/>
      <line x1="18" y1="34" x2="22" y2="30"/>
      <line x1="18" y1="40" x2="22" y2="36"/>
      <line x1="18" y1="46" x2="22" y2="42"/>
      <line x1="18" y1="52" x2="22" y2="48"/>
      <line x1="18" y1="58" x2="22" y2="54"/>
      <line x1="-22" y1="24" x2="-18" y2="28"/>
      <line x1="-22" y1="30" x2="-18" y2="34"/>
      <line x1="-22" y1="36" x2="-18" y2="40"/>
      <line x1="-22" y1="42" x2="-18" y2="46"/>
      <line x1="-22" y1="48" x2="-18" y2="52"/>
      <line x1="-22" y1="54" x2="-18" y2="58"/>
    </g>
    <!-- a tiny number stamped at the keyway bottom -->
    <text x="-4" y="72" font-family="monospace" font-size="9" fill="#111" text-anchor="middle">7</text>
  </g>
  <!-- lens rim shadow -->
  <circle cx="100" cy="100" r="47" stroke="#000" stroke-width="0.5" fill="none" opacity="0.15"/>
</svg>