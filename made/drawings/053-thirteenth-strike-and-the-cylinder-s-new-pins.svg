<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1a1a1a" stroke-width="1.2">
<!-- window frame -->
<rect x="12" y="12" width="176" height="176" stroke="#1a1a1a" stroke-width="2"/>
<!-- rain streaks -->
<line x1="28" y1="18" x2="30" y2="42"/>
<line x1="52" y1="14" x2="55" y2="48"/>
<line x1="78" y1="16" x2="79" y2="50"/>
<line x1="104" y1="12" x2="106" y2="46"/>
<line x1="132" y1="15" x2="133" y2="49"/>
<line x1="158" y1="13" x2="160" y2="47"/>
<line x1="38" y1="58" x2="41" y2="88"/>
<line x1="114" y1="56" x2="116" y2="86"/>
<line x1="168" y1="54" x2="169" y2="84"/>
<!-- bench edge -->
<line x1="12" y1="160" x2="188" y2="160" stroke-width="2"/>
<!-- escapement plate -->
<rect x="60" y="70" width="80" height="60" stroke-width="1.5"/>
<!-- escape wheel -->
<circle cx="100" cy="100" r="22" stroke-width="1.5"/>
<circle cx="100" cy="100" r="8"/>
<!-- 13 teeth, one doubled -->
<g stroke-width="1.2">
<line x1="100" y1="78" x2="100" y2="70"/>
<line x1="107" y1="81" x2="109" y2="73"/>
<line x1="113" y1="88" x2="116" y2="82"/>
<line x1="117" y1="97" x2="121" y2="93"/>
<line x1="119" y1="107" x2="123" y2="104"/>
<line x1="117" y1="117" x2="121" y2="114"/>
<line x1="113" y1="126" x2="116" y2="123"/>
<line x1="107" y1="133" x2="109" y2="131"/>
<line x1="100" y1="138" x2="100" y2="142" stroke-width="2.5"/>
<line x1="93" y1="133" x2="91" y2="131"/>
<line x1="87" y1="126" x2="84" y2="123"/>
<line x1="83" y1="117" x2="79" y2="114"/>
<line x1="81" y1="107" x2="77" y2="104"/>
</g>
<!-- anchor pallets -->
<path d="M72 88 L62 78 L62 68" stroke-width="1.5"/>
<path d="M72 112 L62 122 L62 132" stroke-width="1.5"/>
<!-- cylinder below -->
<rect x="70" y="140" width="60" height="22" stroke-width="1.5"/>
<!-- new pins: 7 filed notches per ward, stamped 7 -->
<g stroke-width="1.5">
<line x1="78" y1="140" x2="78" y2="132"/>
<line x1="86" y1="140" x2="86" y2="132"/>
<line x1="94" y1="140" x2="94" y2="132"/>
<line x1="102" y1="140" x2="102" y2="132"/>
<line x1="110" y1="140" x2="110" y2="132"/>
<line x1="118" y1="140" x2="118" y2="132"/>
<line x1="126" y1="140" x2="126" y2="132"/>
</g>
<!-- notches on pins -->
<g stroke-width="0.8">
<line x1="76" y1="136" x2="80" y2="136"/>
<line x1="76" y1="134" x2="80" y2="134"/>
<line x1="84" y1="136" x2="88" y2="136"/>
<line x1="84" y1="134" x2="88" y2="134"/>
<line x1="92" y1="136" x2="96" y2="136"/>
<line x1="92" y1="134" x2="96" y2="134"/>
<line x1="100" y1="136" x2="104" y2="136"/>
<line x1="100" y1="134" x2="104" y2="134"/>
<line x1="108" y1="136" x2="112" y2="136"/>
<line x1="108" y1="134" x2="112" y2="134"/>
<line x1="116" y1="136" x2="120" y2="136"/>
<line x1="116" y1="134" x2="120" y2="134"/>
<line x1="124" y1="136" x2="128" y2="136"/>
<line x1="124" y1="134" x2="128" y2="134"/>
</g>
<!-- numerals: 13 at top, 7 at cylinder -->
<text x="100" y="58" font-family="monospace" font-size="10" text-anchor="middle" fill="#1a1a1a">13</text>
<text x="100" y="168" font-family="monospace" font-size="8" text-anchor="middle" fill="#1a1a1a">7 pins × 2 notches</text>
<!-- ripple on glass: two faint arcs -->
<path d="M30 30 Q40 25 50 30" stroke-width="0.6" opacity="0.4"/>
<path d="M150 35 Q160 30 170 35" stroke-width="0.6" opacity="0.4"/>
<!-- measurement ticks left side -->
<g stroke-width="1">
<line x1="56" y1="78" x2="52" y2="78"/>
<line x1="56" y1="100" x2="52" y2="100"/>
<line x1="56" y1="122" x2="52" y2="122"/>
</g>
</svg>