<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- background -->
  <rect width="600" height="400" fill="#0d0d0d"/>
  
  <!-- base board -->
  <rect x="30" y="280" width="540" height="40" fill="#1a1510" stroke="#2a2018" stroke-width="2"/>
  
  <!-- telegraph key (left side) -->
  <!-- key base -->
  <rect x="60" y="250" width="120" height="15" fill="#1a1510" stroke="#2a2018" stroke-width="1.5"/>
  <!-- key pivot posts -->
  <rect x="105" y="235" width="10" height="25" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <rect x="105" y="265" width="10" height="15" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <!-- key lever -->
  <path d="M110 235 L110 200 Q180 180 240 200 L240 215 Q180 195 110 215 Z" fill="#2a2018" stroke="#3a3028" stroke-width="1.5"/>
  <!-- key knob -->
  <ellipse cx="240" cy="207.5" rx="12" ry="8" fill="#1a1510" stroke="#3a3028" stroke-width="1.5"/>
  <!-- key contact screw (adjustable) -->
  <line x1="240" y1="250" x2="240" y2="270" stroke="#4a3a28" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="250" r="5" fill="#3a3028" stroke="#4a3a28" stroke-width="1"/>
  <!-- fixed contact on base -->
  <rect x="235" y="270" width="10" height="8" fill="#3a3028" stroke="#4a3a28" stroke-width="1"/>
  <!-- spring return (torsion spring at pivot) -->
  <g stroke="#5a4a38" stroke-width="2" fill="none">
    <path d="M100 240 Q90 240 90 250 Q90 260 100 260 Q110 260 110 250 Q110 240 100 240"/>
    <path d="M95 242 Q88 242 88 248 Q88 254 95 254 Q102 254 102 248 Q102 242 95 242"/>
    <path d="M92 244 Q86 244 86 249 Q86 254 92 254 Q98 254 98 249 Q98 244 92 244"/>
  </g>
  <!-- spring anchor pin -->
  <circle cx="90" cy="250" r="3" fill="#3a3028" stroke="#4a3a28" stroke-width="1"/>
  
  <!-- sounder (right side) -->
  <!-- sounder base -->
  <rect x="400" y="250" width="140" height="15" fill="#1a1510" stroke="#2a2018" stroke-width="1.5"/>
  <!-- sounder frame posts -->
  <rect x="420" y="180" width="12" height="70" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <rect x="508" y="180" width="12" height="70" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <!-- crossbar -->
  <rect x="420" y="180" width="100" height="12" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <!-- copper coil winding pattern (proper layered winding) -->
  <g stroke="#b87a3a" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- bottom layer - left to right -->
    <path d="M435 245 Q445 235 455 245 Q465 255 475 245 Q485 235 495 245"/>
    <path d="M435 242 Q445 232 455 242 Q465 252 475 242 Q485 232 495 242"/>
    <path d="M435 239 Q445 229 455 239 Q465 249 475 239 Q485 229 495 239"/>
    <path d="M435 236 Q445 226 455 236 Q465 246 475 236 Q485 226 495 236"/>
    <!-- second layer - right to left (offset) -->
    <path d="M495 233 Q485 223 475 233 Q465 243 455 233 Q445 223 435 233"/>
    <path d="M495 230 Q485 220 475 230 Q465 240 455 230 Q445 220 435 230"/>
    <path d="M495 227 Q485 217 475 227 Q465 237 455 227 Q445 217 435 227"/>
    <path d="M495 224 Q485 214 475 224 Q465 234 455 224 Q445 214 435 224"/>
    <!-- third layer - left to right -->
    <path d="M435 221 Q445 211 455 221 Q465 231 475 221 Q485 211 495 221"/>
    <path d="M435 218 Q445 208 455 218 Q465 228 475 218 Q485 208 495 218"/>
    <path d="M435 215 Q445 205 455 215 Q465 225 475 215 Q485 205 495 215"/>
    <path d="M435 212 Q445 202 455 212 Q465 222 475 212 Q485 202 495 212"/>
    <!-- insulation wrap hint -->
    <rect x="430" y="210" width="70" height="38" fill="none" stroke="#8a5a2a" stroke-width="0.5" stroke-dasharray="2 2"/>
  </g>
  <!-- coil core (iron) -->
  <rect x="455" y="210" width="30" height="38" fill="#3a3028" stroke="#4a4038" stroke-width="1"/>
  <!-- armature lever -->
  <path d="M470 180 L470 140 Q500 130 540 140 L540 155 Q500 145 470 155 Z" fill="#2a2018" stroke="#3a3028" stroke-width="1.5"/>
  <!-- armature pivot -->
  <circle cx="470" cy="180" r="6" fill="#3a3028" stroke="#4a3a28" stroke-width="1.5"/>
  <!-- armature extension (clicks against anvil) -->
  <rect x="540" y="142" width="25" height="12" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <!-- anvil (click point) -->
  <rect x="565" y="135" width="10" height="25" fill="#1a1510" stroke="#3a3028" stroke-width="2"/>
  <!-- travel adjustment screw -->
  <line x1="570" y1="100" x2="570" y2="135" stroke="#4a3a28" stroke-width="3" stroke-linecap="round"/>
  <circle cx="570" cy="100" r="5" fill="#3a3028" stroke="#4a3a28" stroke-width="1"/>
  <!-- spring return on armature (tension spring) -->
  <g stroke="#5a4a38" stroke-width="1.5" fill="none">
    <path d="M550 148 Q560 155 570 150 Q580 145 590 150 Q600 155 610 150"/>
    <path d="M550 152 Q560 159 570 154 Q580 149 590 154 Q600 159 610 154"/>
  </g>
  <!-- spring anchor on frame -->
  <circle cx="610" cy="150" r="3" fill="#3a3028" stroke="#4a3a28" stroke-width="1"/>
  
  <!-- clockwork battery (conceptual) -->
  <rect x="320" y="100" width="60" height="120" fill="#1a1510" stroke="#3a3028" stroke-width="2"/>
  <rect x="330" y="105" width="20" height="20" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <rect x="330" y="130" width="20" height="20" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <rect x="330" y="155" width="20" height="20" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <rect x="330" y="180" width="20" height="20" fill="#2a2018" stroke="#3a3028" stroke-width="1"/>
  <text x="350" y="235" fill="#6a5a48" font-family="monospace" font-size="10" text-anchor="middle">clockwork
battery</text>
  
  <!-- labels -->
  <text x="170" y="240" fill="#6a5a48" font-family="monospace" font-size="11" text-anchor="middle">KEY</text>
  <text x="470" y="240" fill="#6a5a48" font-family="monospace" font-size="11" text-anchor="middle">SOUNDER</text>
  <text x="470" y="115" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">copper coil
(3 layers, 12 turns)</text>
  <text x="560" y="120" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">armature</text>
  <text x="240" y="165" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">contact
screw</text>
  <text x="590" y="100" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">travel
screw</text>
  <text x="100" y="225" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">torsion
spring return</text>
  <text x="590" y="170" fill="#8a7a58" font-family="monospace" font-size="10" text-anchor="middle">tension
spring return</text>
  
  <!-- click annotation -->
  <g opacity="0.7">
    <circle cx="570" cy="148" r="18" fill="none" stroke="#aa8855" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="570" y="125" fill="#aa8855" font-family="monospace" font-size="10" text-anchor="middle">click here</text>
  </g>
  
  <!-- title -->
  <text x="300" y="25" fill="#8a7a58" font-family="monospace" font-size="14" text-anchor="middle">Telegraph Key &amp; Sounder — copper coil, clicks not ticks</text>
</svg>
