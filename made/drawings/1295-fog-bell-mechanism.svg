<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background: fog -->
  <rect x="0" y="0" width="800" height="600" fill="#e8e8e8"/>
  <g opacity="0.3">
    <ellipse cx="400" cy="300" rx="500" ry="200" fill="#ffffff"/>
    <ellipse cx="200" cy="400" rx="300" ry="150" fill="#ffffff"/>
    <ellipse cx="600" cy="450" rx="250" ry="120" fill="#ffffff"/>
  </g>

  <!-- Bell -->
  <g transform="translate(400, 180)">
    <!-- Bell body -->
    <path d="M-60,0 Q-80,40 -60,100 Q-40,130 0,130 Q40,130 60,100 Q80,40 60,0 Z" 
          fill="#b8860b" stroke="#8b6914" stroke-width="2"/>
    <path d="M-55,0 Q-70,35 -55,90 Q-40,115 0,115 Q40,115 55,90 Q70,35 55,0 Z" 
          fill="#daa520" opacity="0.3"/>
    <!-- Crown -->
    <rect x="-15" y="-25" width="30" height="25" fill="#8b6914" rx="2"/>
    <circle cx="0" cy="-30" r="5" fill="#6b4f10"/>
    <!-- Clapper -->
    <line x1="0" y1="100" x2="0" y2="140" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="140" r="8" fill="#8b6914"/>
  </g>

  <!-- Hygroscopic strip (top left) -->
  <g transform="translate(120, 80)">
    <text x="0" y="-10" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">Hygroscopic strip</text>
    <!-- Dry state (dashed) -->
    <path d="M-40,0 L40,0" stroke="#666" stroke-width="4" stroke-dasharray="8,4" opacity="0.5"/>
    <text x="-50" y="5" font-family="monospace" font-size="10" fill="#666">dry</text>
    <!-- Wet state (curved) -->
    <path d="M-40,60 Q0,100 40,60" stroke="#2a5298" stroke-width="4" fill="none"/>
    <path d="M-40,64 Q0,104 40,64" stroke="#1e3a7a" stroke-width="2" fill="none" opacity="0.5"/>
    <text x="-50" y="65" font-family="monospace" font-size="10" fill="#2a5298">wet (fog)</text>
    <!-- Lever connection -->
    <line x1="0" y1="60" x2="0" y2="100" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="100" r="4" fill="#333"/>
    <line x1="0" y1="100" x2="180" y2="100" stroke="#333" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="200" y="105" font-family="monospace" font-size="10" fill="#333">to hammer</text>
  </g>

  <!-- Hammer mechanism (right side) -->
  <g transform="translate(580, 180)">
    <text x="0" y="-10" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">Hammer</text>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="6" fill="#555"/>
    <!-- Hammer arm -->
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <!-- Hammer head -->
    <rect x="-95" y="-70" width="30" height="16" fill="#444" rx="2"/>
    <!-- Pull from strip (when fog thickens) -->
    <line x1="-80" y1="-60" x2="-180" y2="-60" stroke="#2a5298" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="-200" y="-65" font-family="monospace" font-size="10" fill="#2a5298">strip pulls</text>
    <!-- Release (when fog thins) -->
    <path d="M-80,-60 Q-100,-100 -120,-60" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <text x="-140" y="-110" font-family="monospace" font-size="10" fill="#c0392b">release → strike</text>
  </g>

  <!-- Fog density indicator -->
  <g transform="translate(400, 480)">
    <text x="0" y="-10" font-family="monospace" font-size="14" fill="#333" text-anchor="middle">Fog density → number of strikes</text>
    <rect x="-200" y="0" width="400" height="30" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Thin fog -->
    <rect x="-200" y="0" width="80" height="30" fill="#ffffff" opacity="0.8"/>
    <text x="-160" y="20" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">thin</text>
    <text x="-160" y="45" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">1 strike</text>
    <!-- Medium -->
    <rect x="-120" y="0" width="80" height="30" fill="#e0e0e0"/>
    <text x="-80" y="20" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">medium</text>
    <text x="-80" y="45" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">3 strikes</text>
    <!-- Thick -->
    <rect x="-40" y="0" width="80" height="30" fill="#c0c0c0"/>
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">thick</text>
    <text x="0" y="45" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">5 strikes</text>
    <!-- Very thick -->
    <rect x="40" y="0" width="80" height="30" fill="#a0a0a0"/>
    <text x="80" y="20" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">dense</text>
    <text x="80" y="45" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">7 strikes</text>
    <!-- Pea soup -->
    <rect x="120" y="0" width="80" height="30" fill="#808080"/>
    <text x="160" y="20" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">pea soup</text>
    <text x="160" y="45" font-family="monospace" font-size="11" fill="#fff" text-anchor="middle">9+ strikes</text>
  </g>

  <!-- Title -->
  <text x="400" y="30" font-family="Georgia, serif" font-size="18" fill="#333" text-anchor="middle">A Bell That Strikes the Fog Instead of the Hour</text>
  <text x="400" y="55" font-family="monospace" font-size="11" fill="#666" text-anchor="middle">The count belongs to the weather, not the tower</text>

  <!-- Notes -->
  <g font-family="monospace" font-size="10" fill="#444">
    <text x="50" y="550">Strip material: cellulose acetate / goat gut / whalebone — curls as it takes up water</text>
    <text x="50" y="565">Curl pulls hammer back against spring; release when mist thins and strip relaxes</text>
    <text x="50" y="580">No face, no hands, no hour. Only the number the air gives.</text>
  </g>
</svg>
