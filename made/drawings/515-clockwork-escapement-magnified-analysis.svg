<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
<defs>
<radialGradient id="vig" cx="50%" cy="48%" r="70%">
<stop offset="0" stop-color="#f5f0e8" stop-opacity="0.95"/>
<stop offset="0.6" stop-color="#e8e2d6" stop-opacity="0"/>
<stop offset="1" stop-color="#b8b0a0" stop-opacity="0.4"/></radialGradient>
<filter id="paper" filterUnits="userSpaceOnUse" x="0" y="0" width="768" height="768">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="712" result="n"/>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 .92  0 0 0 0 .88  0 0 0 0 .82  0 0 0 .15 0" result="g"/>
<feBlend in="SourceGraphic" in2="g" mode="multiply"/></filter>
<filter id="pencil" filterUnits="userSpaceOnUse" x="0" y="0" width="768" height="768">
<feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="881" result="w"/>
<feDisplacementMap in="SourceGraphic" in2="w" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs>
<rect width="768" height="768" fill="url(#vig)" filter="url(#paper)"/>
<g filter="url(#pencil)">
<rect x="64" y="64" width="640" height="640" fill="none" stroke="#7a756b" stroke-width="1.5"/>
<circle cx="384" cy="384" r="240" fill="none" stroke="#9d9688" stroke-width="1.2" stroke-dasharray="8,6"/>
<circle cx="384" cy="384" r="160" fill="none" stroke="#9d9688" stroke-width="1" stroke-dasharray="4,4"/>
<circle cx="384" cy="384" r="80" fill="none" stroke="#9d9688" stroke-width="0.8" stroke-dasharray="2,3"/>
<path d="M384 144 L384 624" fill="none" stroke="#9d9688" stroke-width="0.6" stroke-dasharray="6,6"/>
<path d="M144 384 L624 384" fill="none" stroke="#9d9688" stroke-width="0.6" stroke-dasharray="6,6"/>
<g stroke="#5c5850" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M384 144 L384 224"/>
<path d="M384 544 L384 624"/>
<path d="M144 384 L224 384"/>
<path d="M544 384 L624 384"/>
</g>
<g stroke="#4a463e" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M384 224 Q400 200 432 200 Q464 200 480 224"/>
<path d="M384 544 Q400 568 432 568 Q464 568 480 544"/>
<path d="M224 384 Q200 400 200 432 Q200 464 224 480"/>
<path d="M544 384 Q568 400 568 432 Q568 464 544 480"/>
</g>
<ellipse cx="384" cy="384" rx="48" ry="48" fill="none" stroke="#3d3a34" stroke-width="4"/>
<path d="M336 384 Q336 352 360 352 Q384 352 384 384 Q384 416 360 416 Q336 416 336 384" fill="none" stroke="#2d2a24" stroke-width="5" stroke-linecap="round"/>
<path d="M384 336 Q416 336 416 360 Q416 384 384 384 Q352 384 352 360 Q352 336 384 336" fill="none" stroke="#2d2a24" stroke-width="5" stroke-linecap="round"/>
<path d="M360 352 L408 400" fill="none" stroke="#c84a3a" stroke-width="3.5" stroke-linecap="round"/>
<path d="M408 352 L360 400" fill="none" stroke="#c84a3a" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="384" cy="384" r="4" fill="#c84a3a"/>
<g stroke="#3d3a34" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M384 144 L384 120"/>
<path d="M384 624 L384 648"/>
<path d="M144 384 L120 384"/>
<path d="M624 384 L648 384"/>
</g>
<text x="384" y="100" font-family="Georgia, serif" font-size="14" fill="#4a463e" text-anchor="middle" font-style="italic">escape wheel — 30 teeth</text>
<text x="384" y="660" font-family="Georgia, serif" font-size="14" fill="#4a463e" text-anchor="middle" font-style="italic">anchor pallets — entry and exit</text>
<text x="100" y="384" font-family="Georgia, serif" font-size="14" fill="#4a463e" text-anchor="middle" font-style="italic" transform="rotate(-90 100 384)">impulse face</text>
<text x="668" y="384" font-family="Georgia, serif" font-size="14" fill="#4a463e" text-anchor="middle" font-style="italic" transform="rotate(90 668 384)">lock face</text>
<g font-family="Georgia, serif" font-size="11" fill="#5c5850">
<text x="340" y="320" text-anchor="end">tooth 7</text>
<text x="340" y="308" text-anchor="end">catch notch</text>
<path d="M348 318 L360 328" stroke="#5c5850" stroke-width="1.5" fill="none"/>
<text x="428" y="320" text-anchor="start">drag face — flat</text>
<path d="M420 318 L408 328" stroke="#5c5850" stroke-width="1.5" fill="none"/>
<text x="340" y="440" text-anchor="end">tooth 30</text>
<text x="340" y="452" text-anchor="end">widened slot ~0.03mm</text>
<path d="M348 442 L360 438" stroke="#5c5850" stroke-width="1.5" fill="none"/>
</g>
<rect x="64" y="520" width="640" height="120" fill="none" stroke="#7a756b" stroke-width="1"/>
<text x="96" y="548" font-family="Georgia, serif" font-size="13" fill="#3d3a34">what the drawing shows that the eye misses:</text>
<text x="96" y="572" font-family="Georgia, serif" font-size="12" fill="#4a463e">- the drag face on tooth 7 is not a plane — pencil crosses it at three distinct depths</text>
<text x="96" y="592" font-family="Georgia, serif" font-size="12" fill="#4a463e">- the catch notch has a burr on the exit side, 0.02mm, invisible at 10x</text>
<text x="96" y="612" font-family="Georgia, serif" font-size="12" fill="#4a463e">- tooth 30 slot is wider on the entry flank only — asymmetric wear</text>
<text x="96" y="632" font-family="Georgia, serif" font-size="12" fill="#4a463e">- the 62-second pause maps to the anchor resting on tooth 7's drag face</text>
<text x="96" y="652" font-family="Georgia, serif" font-size="12" fill="#4a463e">- no oil trace in the notch — it runs dry, and the drag is metal on metal</text>
</g>
<text x="384" y="720" font-family="Georgia, serif" font-size="12" fill="#7a756b" text-anchor="middle" font-style="italic">515 — escapement magnified analysis — evening day 87</text>
</g>
</svg>
